<div class="dashboard-container">
  <header class="glass-panel">
    <div class="logo">Smart Wall Visualizer</div>
    <div class="user-info">
      <span>Welcome, {{ user?.name }}</span>
      <button class="btn btn-outline" (click)="logout()">Logout</button>
    </div>
  </header>

  <main>
    <div class="actions glass-panel">
      <h2>Your Projects</h2>
      <div class="upload-btn-wrapper">
        <button class="btn btn-primary">Start New Project (Upload Room Image)</button>
        <input type="file" name="myfile" accept="image/*" (change)="onFileSelected($event)" />
      </div>
    </div>

    <div *ngIf="loading" class="loading">Loading projects...</div>

    <div class="projects-grid" *ngIf="!loading">
      <div class="project-card glass-panel" *ngFor="let p of projects" [routerLink]="['/workspace', p._id]">
        <div class="image-container">
          <img [src]="p.previewImageUrl || 'http://localhost:5000' + p.originalImageUrl" alt="{{ p.name }}">
        </div>
        <div class="card-content">
          <h3>{{ p.name }}</h3>
          <p>Created: {{ p.createdAt | date:'mediumDate' }}</p>
        </div>
      </div>
      
      <div *ngIf="projects.length === 0" class="empty-state">
        <p>No projects yet. Upload an image to start visualizing!</p>
      </div>
    </div>
  </main>
</div>

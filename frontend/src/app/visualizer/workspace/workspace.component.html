<div class="workspace-container">
  <!-- Top Navbar -->
  <header class="glass-panel workspace-header">
    <div class="left">
      <button class="btn btn-outline" (click)="goBack()">← Back</button>
      <h2>{{ project?.name }}</h2>
    </div>
    <div class="right">
      <button class="btn btn-primary" (click)="saveProject()">Save Design</button>
    </div>
  </header>

  <div class="workspace-main">
    <!-- Left Sidebar: Tools & Colors -->
    <aside class="sidebar glass-panel">
      
      <div class="tool-section">
        <h3>Wall Selection Tool</h3>
        <p class="help-text">Click on the image to draw a polygon around the wall. Click near the start point to close the shape.</p>
        <button class="btn btn-outline btn-full" (click)="resetSelection()">Reset Selection</button>
      </div>

      <div class="color-section" *ngIf="isPolygonClosed">
        <h3>Paint Colors</h3>
        <div class="color-grid">
          <div 
            class="color-swatch" 
            *ngFor="let c of colors" 
            [style.backgroundColor]="c.hexCode"
            [class.active]="selectedColor?._id === c._id"
            (click)="selectColor(c)"
            title="{{ c.name }}"
          ></div>
        </div>
        <p class="selected-color-name" *ngIf="selectedColor">Selected: <strong>{{ selectedColor.name }}</strong></p>
      </div>
      
    </aside>

    <!-- Center: Canvas Area -->
    <main class="canvas-area">
      <div class="canvas-wrapper glass-panel">
        <canvas #canvas (click)="onCanvasClick($event)"></canvas>
      </div>
    </main>
  </div>
</div>
